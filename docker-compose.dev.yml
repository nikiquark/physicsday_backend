# Локальная разработка.
#
#   docker compose -f docker-compose.dev.yml up
#
# Исходники смонтированы с хоста: Django перезапускается сам (runserver),
# Next обновляет страницу без пересборки (turbopack HMR).
# Порты открыты на всех интерфейсах, Postgres доступен снаружи на 5442
# (не 5432: на машине разработчика обычно уже стоит свой PostgreSQL).
# Порт переопределяется переменной POSTGRES_DEV_PORT.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-physicsday}
      POSTGRES_USER: ${POSTGRES_USER:-physicsday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-physicsday}
      TZ: ${TZ:-Asia/Novosibirsk}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      # Системный PostgreSQL занимает 5432, поэтому наружу выносим 5442.
      - "${POSTGRES_DEV_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-physicsday}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-DEBUG}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-key-not-for-production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      POSTGRES_DB: ${POSTGRES_DB:-physicsday}
      POSTGRES_USER: ${POSTGRES_USER:-physicsday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-physicsday}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      TZ: ${TZ:-Asia/Novosibirsk}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api}
      API_URL_INTERNAL: ${API_URL_INTERNAL:-http://backend:8000/api}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      WATCHPACK_POLLING: "true"
      TZ: ${TZ:-Asia/Novosibirsk}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      # node_modules берутся из образа, а не с хоста: иначе бинарные
      # зависимости, собранные под другую ОС, ломают сборку.
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"

volumes:
  pgdata_dev:
